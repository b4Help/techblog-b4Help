# Builds and deploys the Jekyll blog to GitHub Pages.
# Jekyll only publishes posts dated on or before build time, so a daily
# scheduled build publishes each dated post on its day with no manual commit.
name: Build and deploy blog

on:
  push:
    branches: [main]
  schedule:
    # Three runs a day. GitHub can delay or drop scheduled jobs under load
    # (it did on 09/14/2026), so the later runs catch a dropped one. Builds
    # are idempotent, so extra runs cost nothing. All off the top of the hour.
    - cron: "37 10 * * *"   # 06:37 EDT / 05:37 EST
    - cron: "23 13 * * *"   # 09:23 EDT / 08:23 EST
    - cron: "41 17 * * *"   # 13:41 EDT / 12:41 EST
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  # GitHub disables scheduled workflows in a public repo after 60 days with no
  # repository activity. When the newest commit is 50+ days old, this job makes
  # a one-line commit so the daily schedule keeps running. Commits made with
  # GITHUB_TOKEN do not trigger new workflow runs, so this cannot loop.
  keepalive:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Commit keepalive if repo is going quiet
        run: |
          last=$(git log -1 --format=%ct)
          age_days=$(( ( $(date +%s) - last ) / 86400 ))
          echo "Newest commit is ${age_days} days old"
          if [ "$age_days" -lt 50 ]; then
            echo "Recent activity, no keepalive needed"
            exit 0
          fi
          date -u +"%Y-%m-%dT%H:%M:%SZ" > .github/keepalive
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/keepalive
          git commit -m "Keepalive: keep scheduled blog builds enabled"
          git push
